spring:
  application:
    name: Payflow-reliability
  datasource:
    url: jdbc:postgresql://localhost:5432/payflow_reliability
    username: payflow_reliability
    password: payflow_reliability
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

payment-lab:
  provider:
    demo-signature: local-demo-signature
